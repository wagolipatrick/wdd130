<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Contact White Water Rafting to learn more about our rafting adventures, trips, and services.">

    <meta name="author" content="Wagoli Patrick">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/logo.png" alt="White Water Rafting logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>


    <main>

        <!-- HERO -->
        <div class="hero">

            <img src="images/hero.jpg" alt="People enjoying a white water rafting adventure">

            <h1>White Water Rafting</h1>

        </div>


        <!-- CONTACT INFORMATION -->
        <section class="contact-information">

            <h2>Contact Us</h2>

            <div class="contact-info">

                <p>+256 756 070 296</p>
                <p>info@whitewaterrafting.com</p>
                <p>Kampala, Uganda</p>

            </div>

        </section>


        <!-- MAP AND MESSAGE FORM -->
        <section class="contact-grid">

            <!-- FIND US -->
            <div class="contact-map">

                <h2>Find Us</h2>

                <iframe src="https://www.google.com/maps?q=Kampala,Uganda&output=embed" width="100%"
                  height="350" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>


            <!-- SEND US A MESSAGE -->
            <div class="message-section">

                <h2>Send Us a Message</h2>

                <form class="contact-form">

                    <label for="name">Name</label>

                    <input type="text" id="name" name="name" required>


                    <label for="email">Email</label>

                    <input type="email" id="email" name="email" required>


                    <!-- MESSAGE PURPOSE -->

                    <fieldset>

                        <legend>Message Purpose</legend>

                        <label for="general">

                            <input type="radio" id="general" name="purpose" value="general"
                              required>

                            General Inquiry

                        </label>


                        <label for="reservation">

                            <input type="radio" id="reservation" name="purpose" value="reservation">

                            Reservation Question

                        </label>


                        <label for="suggestion">

                            <input type="radio" id="suggestion" name="purpose" value="suggestion">

                            Website Suggestion

                        </label>

                    </fieldset>


                    <!-- MESSAGE -->

                    <label for="message">Message</label>

                    <textarea id="message" name="message" required></textarea>


                    <!-- CHECKBOX -->

                    <label for="newsletter">

                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">

                        Please send me updates about White Water Rafting.

                    </label>


                    <!-- SUBMIT -->

                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>

        </section>


        <!-- SERVICE SECTION -->
        <section class="service-section">

            <h2>We are here to serve you</h2>

            <div class="contact-team">

                <figure>

                    <img src="images/employee1.jpg" alt="White Water Rafting employee">

                    <figcaption>Our Rafting Guide</figcaption>

                </figure>


                <figure>

                    <img src="images/employee2.jpg" alt="White Water Rafting employee">

                    <figcaption>Our River Guide</figcaption>

                </figure>


                <figure>

                    <img src="images/employee3.jpg" alt="White Water Rafting employee">

                    <figcaption>Our Safety Guide</figcaption>

                </figure>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 White Water Rafting |
            Wagoli Patrick |
            Kampala, Uganda
        </p>

        <nav class="socialmedia">

            <a href="#" aria-label="Facebook">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="#" aria-label="Instagram">
                <img src="images/instagram-.svg" alt="Instagram">
            </a>

            <a href="#" aria-label="Twitter">
                <img src="images/linkedin.svg" alt="Twitter">
            </a>

        </nav>

    </footer>

</body>

</html>
