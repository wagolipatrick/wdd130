<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Contact White Water Rafting for reservations, questions, and information about our rafting adventures.">

    <meta name="author" content="Wagoli Patrick">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <!-- Contact Information -->
        <section class="contact-info">

            <h1>Contact Us</h1>

            <h2>Get in Touch</h2>

            <p>
                <strong>Address:</strong>
                123 River Road, Kampala, Uganda
            </p>

            <p>
                <strong>Phone:</strong>
                +256 756 070 296
            </p>

            <p>
                <strong>Email:</strong>
                info@whitewaterrafting.com
            </p>

            <!-- Google Map -->
            <iframe src="https://www.google.com/maps?q=Kampala,+Uganda&output=embed" width="400"
              height="250" loading="lazy" title="White Water Rafting location">
            </iframe>

        </section>


        <!-- Employee Profiles -->
        <section class="employees">

            <h2>Meet Our Team</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee1.jpg" alt="James, River Guide">
                    <figcaption>James - River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Sarah, Reservations Manager">
                    <figcaption>Sarah - Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="David, Safety Manager">
                    <figcaption>David - Safety Manager</figcaption>
                </figure>

            </div>

        </section>


        <!-- Contact Form -->
        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>


                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>


                <fieldset>

                    <legend>Purpose of Message</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                </fieldset>


                <label for="message">Message:</label>

                <textarea id="message" name="message" rows="6" required></textarea>


                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>


                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 White Water Rafting | Wagoli Patrick
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram-.svg" alt="Instagram">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

        </nav>

    </footer>

</body>

</html>
